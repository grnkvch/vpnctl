mixed-port: 17891
allow-lan: false
bind-address: 127.0.0.1
mode: rule
log-level: silent
ipv6: false
geodata-loader: memconservative
geo-auto-update: false

dns:
  enable: true
  ipv6: false
  cache-algorithm: arc
  enhanced-mode: redir-host
  use-hosts: false
  use-system-hosts: false
  respect-rules: false
  default-nameserver:
    - 10.211.0.1
  nameserver:
    - "udp://10.211.0.1:53#DIRECT"

proxies:
  - name: GATEWAY
    type: direct
    udp: true

rules:
  - DOMAIN-SUFFIX,selected.test,GATEWAY
  - MATCH,DIRECT
