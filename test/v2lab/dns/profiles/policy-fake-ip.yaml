mixed-port: 17891
allow-lan: false
bind-address: 127.0.0.1
mode: rule
log-level: silent
ipv6: false
geodata-loader: memconservative
geo-auto-update: false

dns:
  enable: true
  ipv6: false
  cache-algorithm: arc
  enhanced-mode: fake-ip
  fake-ip-range: 198.19.0.1/16
  fake-ip-filter-mode: whitelist
  fake-ip-filter:
    - "+.selected.test"
  fake-ip-ttl: 2
  use-hosts: false
  use-system-hosts: false
  respect-rules: false
  default-nameserver:
    - 10.211.0.1
  nameserver:
    - "udp://10.211.0.1:53#DIRECT"
  nameserver-policy:
    "+.selected.test": "udp://10.212.0.1:53#GATEWAY"

proxies:
  - name: GATEWAY
    type: direct
    udp: true

rules:
  - DOMAIN-SUFFIX,selected.test,GATEWAY
  - MATCH,DIRECT
