user nobody nogroup;
worker_processes 1;
pid /run/vpnctl-v2-spike-ingress/nginx.pid;
error_log /dev/null crit;

events {
    worker_connections 128;
}

http {
    access_log off;
    server_tokens off;
    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 30s;
    client_body_temp_path /run/vpnctl-v2-spike-ingress/client_temp;
    proxy_temp_path /run/vpnctl-v2-spike-ingress/proxy_temp;

    server {
        listen 0.0.0.0:443 ssl http2;
        server_name _;

        ssl_certificate /etc/vpnctl-v2-spike/ingress/gateway.crt;
        ssl_certificate_key /etc/vpnctl-v2-spike/ingress/gateway.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:VPNCTLIngressTLS:1m;
        ssl_session_timeout 10m;

        location = /telegram/webhook {
            proxy_pass http://127.0.0.1:18081;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection "";
        }

        location / {
            return 404;
        }
    }
}
