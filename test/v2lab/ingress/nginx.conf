user nobody nogroup;
worker_processes 1;
worker_shutdown_timeout 10s;
worker_rlimit_nofile 512;
pid /run/vpnctl-v2-spike-ingress/nginx.pid;
error_log /dev/null crit;

events {
    worker_connections 256;
    multi_accept off;
}

http {
    access_log off;
    server_tokens off;
    limit_conn_zone $server_name zone=vpnctl_gateway:64k;
    limit_conn_zone $uri zone=vpnctl_expose:64k;
    limit_conn_status 503;

    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    client_max_body_size 8m;
    client_body_buffer_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    keepalive_requests 100;
    send_timeout 15s;
    reset_timedout_connection on;
    proxy_connect_timeout 2s;
    proxy_send_timeout 15s;
    proxy_read_timeout 15s;
    client_body_temp_path /run/vpnctl-v2-spike-ingress/client_temp;
    proxy_temp_path /run/vpnctl-v2-spike-ingress/proxy_temp;

    server {
        listen 0.0.0.0:443 ssl http2;
        server_name _;

        ssl_certificate /etc/vpnctl-v2-spike/ingress/gateway.crt;
        ssl_certificate_key /etc/vpnctl-v2-spike/ingress/gateway.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:VPNCTLIngressTLS:1m;
        ssl_session_timeout 10m;
        http2_body_preread_size 16k;
        http2_max_concurrent_streams 64;
        limit_conn vpnctl_gateway 64;
        include /etc/vpnctl-v2-spike/ingress/generation.conf;

        error_page 502 =503 @vpnctl_unavailable;

        location = /telegram/webhook {
            client_max_body_size 1m;
            limit_conn vpnctl_gateway 64;
            limit_conn vpnctl_expose 40;
            proxy_pass http://127.0.0.1:18081;
            include /etc/vpnctl-v2-spike/ingress/proxy-common.conf;
        }

        location = /load/a {
            client_max_body_size 1m;
            limit_conn vpnctl_gateway 64;
            limit_conn vpnctl_expose 40;
            proxy_pass http://127.0.0.1:18081;
            include /etc/vpnctl-v2-spike/ingress/proxy-common.conf;
        }

        location = /load/b {
            client_max_body_size 1m;
            limit_conn vpnctl_gateway 64;
            limit_conn vpnctl_expose 40;
            proxy_pass http://127.0.0.1:18081;
            include /etc/vpnctl-v2-spike/ingress/proxy-common.conf;
        }

        location = /stream/webhook {
            client_max_body_size 4m;
            limit_conn vpnctl_gateway 64;
            limit_conn vpnctl_expose 8;
            proxy_pass http://127.0.0.1:18081;
            include /etc/vpnctl-v2-spike/ingress/proxy-common.conf;
        }

        location = /hard-limit/webhook {
            client_max_body_size 8m;
            limit_conn vpnctl_gateway 64;
            limit_conn vpnctl_expose 8;
            proxy_pass http://127.0.0.1:18081;
            include /etc/vpnctl-v2-spike/ingress/proxy-common.conf;
        }

        location = /timeout {
            client_max_body_size 64k;
            limit_conn vpnctl_gateway 64;
            limit_conn vpnctl_expose 8;
            proxy_pass http://127.0.0.1:18081;
            include /etc/vpnctl-v2-spike/ingress/proxy-common.conf;
            proxy_read_timeout 1s;
        }

        location = /unavailable {
            client_max_body_size 64k;
            limit_conn vpnctl_gateway 64;
            limit_conn vpnctl_expose 8;
            proxy_pass http://127.0.0.1:18082;
            include /etc/vpnctl-v2-spike/ingress/proxy-common.conf;
            proxy_connect_timeout 1s;
        }

        location @vpnctl_unavailable {
            return 503;
        }

        location / {
            return 404;
        }
    }
}
