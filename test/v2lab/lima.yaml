minimumLimaVersion: 2.0.0

vmType: qemu
arch: x86_64
cpus: 1
memory: 512MiB
disk: 10GiB

images:
  - location: https://cloud-images.ubuntu.com/releases/noble/release-20260518/ubuntu-24.04-server-cloudimg-amd64.img
    arch: x86_64
    digest: sha256:53fdde898feed8b027d94baa9cfe8229867f330a1d9c49dc7d84465ee7f229f7

mounts: []
containerd:
  system: false
  user: false
upgradePackages: false

networks:
  - lima: user-v2

portForwards:
  - guestPort: 1053
    guestIP: 0.0.0.0
    guestIPMustBeZero: false
    proto: any
    ignore: true
  - guestPort: 8443
    guestIP: 0.0.0.0
    guestIPMustBeZero: false
    proto: any
    ignore: true
  - guestPort: 17890
    guestIP: 0.0.0.0
    guestIPMustBeZero: false
    proto: any
    ignore: true
  - guestPort: 18080
    guestIP: 0.0.0.0
    guestIPMustBeZero: false
    proto: any
    ignore: true
  - guestPort: 19090
    guestIP: 0.0.0.0
    guestIPMustBeZero: false
    proto: any
    ignore: true

provision:
  - mode: system
    file:
      url: ./provision.sh

probes:
  - mode: readiness
    description: vpnctl v2 lab prerequisites
    script: |
      #!/bin/sh
      set -eu
      test "$(dpkg --print-architecture)" = amd64
      grep -q '^VERSION_ID="24.04"$' /etc/os-release
      test "$(nproc)" -eq 1
      command -v jq >/dev/null
      command -v nft >/dev/null
      command -v ss >/dev/null
      command -v tc >/dev/null
      command -v vmstat >/dev/null
    hint: See /var/log/cloud-init-output.log in the guest
